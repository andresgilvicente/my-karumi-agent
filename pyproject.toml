[project]
name = "karumi-agent"
version = "0.1.0"
description = "Fully local, free voice agent that gives live demos of websites it does not control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Voice pipeline. `webrtc` pulls aiortc; `runner` pulls the dev server + prebuilt UI.
    # Silero VAD and LocalSmartTurnAnalyzerV3 models ship inside the wheel - no download.
    "pipecat-ai[webrtc,runner,kokoro]==1.7.0",
    # Browser control. Bundled Chromium, headed via WSLg.
    "playwright>=1.62.0,<2",
    # Config, CLI, HTTP.
    "pydantic>=2.10.6,<3",
    "pydantic-settings>=2.7.0,<3",
    "typer>=0.15.0,<1",
    "rich>=13.9.0,<14",
    "httpx>=0.28.0,<1",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
# Faster, more accurate local STT than the Whisper fallback. Pure onnxruntime +
# numpy: no torch, no NeMo, no CTranslate2 (which is stranded on CUDA 12).
parakeet = ["onnx-asr[cpu,hub]>=0.12.0,<1"]
# Zero-friction STT fallback, already wrapped by Pipecat.
whisper = ["pipecat-ai[whisper]==1.7.0"]

[project.scripts]
karumi = "karumi_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<2",
    "ruff>=0.9.0,<1",
    "mypy>=1.14.0,<2",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karumi_agent"]
# overlay.js and the console page are runtime assets, not just source.
artifacts = ["*.js", "*.html"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit (security)
    "PTH",       # use pathlib
    "RET",       # return simplification
    "TID",       # tidy imports
]
ignore = [
    "S101",   # assert is fine in tests and internal invariants
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
# Tests may use subprocess, hardcoded fixture credentials, and long lines in fixtures.
"tests/**" = ["S603", "S607", "E501"]
"fixtures/**" = ["E501"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# Third-party packages without shipped stubs. Keeping this list explicit and
# short makes it obvious when we start depending on something untyped.
[[tool.mypy.overrides]]
module = ["pipecat.*", "onnx_asr.*", "kokoro_onnx.*", "uvicorn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "requires_browser: needs a real Chromium (playwright install chromium)",
    "requires_model: needs a local Ollama model to be pulled and served",
    "requires_stt: needs local STT model weights on disk",
    "requires_tts: needs local TTS model weights on disk",
    "requires_gpu: needs a CUDA device",
    "requires_network: reaches the public internet",
    "slow: takes more than a few seconds",
]
