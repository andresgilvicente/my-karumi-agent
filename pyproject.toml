[project]
name = "karumi-agent"
version = "0.1.0"
description = "Voice agent that gives live demos of web products it does not have the source code for."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Pipecat is a core dependency, not an optional one: its worker bus and UIWorker
# are what the agent is built on, and Phase 2 uses them with no voice involved.
# Pinned to the exact minor we researched — the UI Worker protocol constant we
# publish under (`__ui_snapshot`) is private, so a floating pin could silently
# stop snapshots reaching the model. See docs/ARCHITECTURE.md §7.2.
dependencies = [
    "pipecat-ai[anthropic]>=1.7.0,<1.8",
    "playwright>=1.55.0,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<26",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# The media stack: transports, speech services and turn detection. Only Phase 3
# onwards needs it, so a text-mode install stays free of audio dependencies.
voice = [
    "pipecat-ai[cartesia,deepgram,local-smart-turn,runner,silero,webrtc]>=1.7.0,<1.8",
]

# Alternative LLM providers. `providers/llm.py` imports these lazily, so a
# missing one surfaces as an ImportError naming the extra to install.
llm-openai = ["pipecat-ai[openai]>=1.7.0,<1.8"]
llm-google = ["pipecat-ai[google]>=1.7.0,<1.8"]

[project.scripts]
karumi = "karumi_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karumi_agent"]

# The page bundle is a build artifact, but it must ship with the wheel: without
# it there is nothing to inject and the agent cannot see anything.
artifacts = ["src/karumi_agent/browser/injected/dist/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: requires a real Chromium via Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/karumi_agent"]

# Pipecat and regex ship no type information. Silencing the import here keeps
# strict mode meaningful for our own code instead of trading it away wholesale.
[[tool.mypy.overrides]]
module = ["pipecat.*", "regex.*", "yaml.*"]
ignore_missing_imports = true

# `@job` and `@tool` are Pipecat decorators with no annotations, so under strict
# mode every handler they wrap is reported as untyped. The handlers themselves
# are annotated; only the decorator is opaque. Scoped to the worker package so
# the exemption cannot drift into code that has no such excuse.
[[tool.mypy.overrides]]
module = "karumi_agent.workers.*"
disallow_untyped_decorators = false
