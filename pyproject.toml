[project]
name = "karumi-agent"
version = "0.1.0"
description = "Voice agent that gives live demos of web products it does not have the source code for."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies cover Phase 1 (browser spike) and Phase 2 (text-driven UI
# worker). The voice stack lives in the `voice` extra so the browser layer can
# be developed, tested and run without pulling in the whole media pipeline.
dependencies = [
    "playwright>=1.55.0,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<26",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Pinned to the exact minor we researched: the UI Worker protocol constants we
# depend on (`__ui_snapshot`) are private, so a floating pin could silently
# break snapshot delivery. See docs/ARCHITECTURE.md § Riesgos.
voice = [
    "pipecat-ai[anthropic,cartesia,deepgram,local-smart-turn,runner,silero,webrtc]>=1.7.0,<1.8",
]

[project.scripts]
karumi = "karumi_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karumi_agent"]

# The page bundle is a build artifact, but it must ship with the wheel: without
# it there is nothing to inject and the agent cannot see anything.
artifacts = ["src/karumi_agent/browser/injected/dist/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: requires a real Chromium via Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/karumi_agent"]

# Pipecat and regex ship no type information. Silencing the import here keeps
# strict mode meaningful for our own code instead of trading it away wholesale.
[[tool.mypy.overrides]]
module = ["pipecat.*", "regex.*", "yaml.*"]
ignore_missing_imports = true

# `@job` and `@tool` are Pipecat decorators with no annotations, so under strict
# mode every handler they wrap is reported as untyped. The handlers themselves
# are annotated; only the decorator is opaque. Scoped to the worker package so
# the exemption cannot drift into code that has no such excuse.
[[tool.mypy.overrides]]
module = "karumi_agent.workers.*"
disallow_untyped_decorators = false
